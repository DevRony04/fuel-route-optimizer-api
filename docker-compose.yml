version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fuel_optimizer_db
    environment:
      - POSTGRES_DB=fuel_optimizer_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuel_optimizer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fuel_optimizer_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fuel_optimizer_api
    command: sh -c "python manage.py migrate && python manage.py import_fuel_prices && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SECRET_KEY=production-django-secret-key-987654321
      - DJANGO_DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://postgres:postgres@db:5432/fuel_optimizer_db
      - REDIS_URL=redis://redis:6379/0
      # Change ORS_API_KEY to your actual key when running
      - ORS_API_KEY=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
